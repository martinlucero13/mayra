<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FECOVITA · Encuesta de Satisfacción 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   PALETA — Reemplazá las variables del tema 0 por los colores
   exactos del design system del portal de vendedores.
   ============================================================ */
:root{
  --primary:#8a0d6f;      /* bordó corporativo */
  --primary-2:#5e0080;
  --accent:#c9a227;
  --bg:#eef0f3;
  --card:#ffffff;
  --text:#1f2430;
  --muted:#6b7280;
  --border:#e3e6eb;
  --radius:14px;
  --font-title:'Inter','Segoe UI',system-ui,sans-serif;
}
body[data-theme="1"]{ --bg:#f3eee7; --accent:#d9a400; }
body[data-theme="2"]{ --primary:#a8324a; --primary-2:#c2475f; --bg:#fbeee2; --accent:#f2be00; --border:#f0dccb; }
body[data-theme="3"]{ --primary:#d94f70; --primary-2:#e8708b; --bg:#fff4d6; --card:#fffdf7; --accent:#f6c90e; --border:#f7e2a8; --font-title:'Dancing Script',cursive; }
body[data-theme="4"]{ --primary:#e0436b; --primary-2:#f06a8a; --bg:#fff1c9; --card:#fffaf0; --accent:#ffcc00; --border:#ffe08a; --font-title:'Dancing Script',cursive; }

*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{
  font-family:'Inter','Segoe UI',system-ui,sans-serif;
  background:var(--bg); color:var(--text);
  transition:background-color 1.4s ease;
  display:flex; flex-direction:column; min-height:100vh; overflow-x:hidden;
}

/* Fondo romántico que aparece de a poco */
#bg-romance{
  position:fixed; inset:0; z-index:0; pointer-events:none; opacity:0;
  transition:opacity 1.6s ease;
  background:
    radial-gradient(circle at 10% 20%, rgba(255,214,0,.35) 0, transparent 35%),
    radial-gradient(circle at 90% 15%, rgba(255,105,140,.30) 0, transparent 35%),
    radial-gradient(circle at 80% 85%, rgba(255,214,0,.35) 0, transparent 40%),
    radial-gradient(circle at 15% 90%, rgba(255,105,140,.25) 0, transparent 40%);
}
body[data-theme="1"] #bg-romance{opacity:.15}
body[data-theme="2"] #bg-romance{opacity:.4}
body[data-theme="3"] #bg-romance{opacity:.75}
body[data-theme="4"] #bg-romance{opacity:1}

#petals{position:fixed; inset:0; pointer-events:none; z-index:1; overflow:hidden}
.petal{position:absolute; top:-50px; animation:fall linear forwards; opacity:.9}
@keyframes fall{
  0%{transform:translate(0,0) rotate(0)}
  50%{transform:translate(30px,55vh) rotate(180deg)}
  100%{transform:translate(-20px,115vh) rotate(360deg)}
}

/* Topbar estilo portal */
.topbar{
  position:relative; z-index:3;
  background:var(--primary); color:#fff;
  display:flex; align-items:center; justify-content:space-between;
  padding:14px 24px; box-shadow:0 2px 10px rgba(0,0,0,.12);
  transition:background-color 1.4s ease;
}
.brand{display:flex; align-items:center; gap:12px}
.logo{
  width:38px; height:38px; border-radius:10px; background:#fff; color:var(--primary);
  display:grid; place-items:center; font-weight:800; font-size:20px; transition:all .8s;
}
.brand-text{display:flex; flex-direction:column; line-height:1.1}
#brandText{font-weight:800; letter-spacing:1px; font-size:18px}
#brandSub{font-size:12px; opacity:.85}
.user-chip{background:rgba(255,255,255,.15); padding:6px 12px; border-radius:20px; font-size:13px}

main{position:relative; z-index:2; flex:1; display:flex; justify-content:center; align-items:flex-start; padding:32px 16px}
.card{
  width:100%; max-width:660px; background:var(--card);
  border:1px solid var(--border); border-radius:var(--radius);
  box-shadow:0 10px 30px rgba(0,0,0,.08); padding:28px;
  transition:opacity .35s ease, transform .35s ease, background-color 1.4s, border-color 1.4s;
}
.card.out{opacity:0; transform:translateY(12px)}
.card.glitch{animation:glitch .25s steps(2) 8}
@keyframes glitch{
  0%{transform:translate(0); filter:none}
  25%{transform:translate(-4px,2px); filter:hue-rotate(90deg)}
  50%{transform:translate(4px,-2px); filter:invert(.1)}
  75%{transform:translate(-2px,-3px); filter:hue-rotate(-60deg)}
  100%{transform:translate(0); filter:none}
}

.progress{margin-bottom:22px}
.progress-label{font-size:12px; color:var(--muted); margin-bottom:6px; display:flex; justify-content:space-between}
.bar{height:8px; background:var(--border); border-radius:8px; overflow:hidden}
#bar{height:100%; width:0; background:linear-gradient(90deg,var(--primary),var(--accent)); transition:width .6s ease}

h1,h2{font-family:var(--font-title); color:var(--primary); margin-bottom:12px; line-height:1.2; transition:color 1.4s}
h1{font-size:28px} h2{font-size:23px}
body[data-theme="3"] h1, body[data-theme="4"] h1{font-size:40px}
body[data-theme="3"] h2, body[data-theme="4"] h2{font-size:34px}
p{line-height:1.6; margin-bottom:12px}
.muted{color:var(--muted)}
.tag{display:inline-block; font-size:11px; letter-spacing:.5px; text-transform:uppercase; color:var(--muted); border:1px solid var(--border); padding:4px 10px; border-radius:20px; margin-bottom:14px}
.meta{list-style:none; margin:14px 0; display:grid; gap:6px; font-size:14px}
.tiny{font-size:10px; color:#b5b9c2}
.note{font-size:13px; background:rgba(0,0,0,.04); padding:8px 12px; border-radius:10px; margin-bottom:14px}

.btn{
  border:none; cursor:pointer; font:inherit; font-weight:600;
  padding:12px 22px; border-radius:10px; transition:transform .2s, background-color .4s, box-shadow .2s;
}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--primary); color:#fff; box-shadow:0 4px 12px rgba(0,0,0,.12)}
.btn.primary:hover{background:var(--primary-2)}
.btn.primary:disabled{opacity:.45; cursor:not-allowed}
.btn.ghost{background:transparent; border:1px solid var(--border); color:var(--text)}
.row{display:flex; gap:10px; flex-wrap:wrap; margin-top:16px}

.options{display:grid; gap:10px; margin-top:14px}
.option{
  text-align:left; background:var(--card); border:1.5px solid var(--border); color:var(--text);
  padding:13px 16px; border-radius:10px; cursor:pointer; font:inherit; transition:all .2s;
}
.option:hover:not(:disabled){border-color:var(--primary); transform:translateX(4px)}
.option.selected{border-color:var(--primary); background:var(--primary); color:#fff}
.option:disabled:not(.selected){opacity:.5}

.stars{display:flex; gap:8px; margin:18px 0; font-size:38px}
.star{background:none; border:none; cursor:pointer; color:#d1d5db; transition:transform .15s,color .15s; font-size:inherit}
.star.on{color:var(--accent)} .star:hover{transform:scale(1.15)}

input[type=range]{width:100%; accent-color:var(--primary); margin:18px 0 6px}
.range-label{text-align:center; font-size:22px; font-weight:600; min-height:34px}

pre.code{
  background:#1e1e2e; color:#f8f8f2; padding:14px; border-radius:10px; font-size:13px;
  overflow-x:auto; margin:12px 0; font-family:Consolas,'Courier New',monospace;
}
.kw{color:#ff79c6}.str{color:#f1fa8c}.cm{color:#6272a4}
.alert{border-left:4px solid #e0a800; background:#fff8e1; padding:12px 14px; border-radius:8px; margin-bottom:12px; font-size:14px}

.adv{display:grid; gap:10px; margin:14px 0}
.adv-item{
  background:linear-gradient(135deg,rgba(255,204,0,.18),rgba(255,105,140,.12));
  border:1px solid var(--border); border-radius:12px; padding:12px 14px;
  animation:popin .45s ease both;
}
@keyframes popin{from{opacity:0; transform:scale(.9) translateY(8px)}to{opacity:1; transform:none}}

.kpis{display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin:14px 0}
.kpi{background:var(--card); border:1px solid var(--border); border-radius:12px; padding:12px; box-shadow:0 3px 10px rgba(0,0,0,.05); animation:popin .45s ease both}
.kpi .k-title{font-size:12px; color:var(--muted)}
.kpi .k-value{font-size:26px; font-weight:800; color:var(--primary)}
.kpi .k-delta{font-size:12px; color:#16a34a; font-weight:600}
.quals{list-style:none; display:grid; gap:8px; margin:10px 0}
.quals li{animation:popin .45s ease both; padding:8px 12px; background:rgba(255,204,0,.15); border-radius:10px}

.loader{display:flex; flex-direction:column; align-items:center; gap:18px; padding:40px 0}
.spinner{width:46px; height:46px; border:4px solid var(--border); border-top-color:var(--primary); border-radius:50%; animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.game{
  position:relative; height:360px; border-radius:14px; overflow:hidden; margin-top:12px;
  background:linear-gradient(180deg,#bfe3ff 0%,#fff6d6 100%); border:1px solid var(--border);
  touch-action:manipulation; user-select:none;
}
.counter{position:absolute; top:10px; right:12px; background:#fff; padding:6px 12px; border-radius:20px; font-weight:700; color:var(--primary); z-index:2; box-shadow:0 2px 6px rgba(0,0,0,.1)}
.fall-item{
  position:absolute; top:-50px; background:none; border:none; font-size:36px; cursor:pointer;
  animation:drop linear forwards; padding:6px; transition:opacity .3s, transform .3s;
}
.fall-item.caught{opacity:0; transform:scale(1.8)}
@keyframes drop{to{top:105%}}

.big-heart{font-size:70px; text-align:center; animation:beat 1s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.18)}30%{transform:scale(1)}45%{transform:scale(1.12)}}
.final-q{text-align:center}
.answer-zone{position:relative; min-height:230px; display:flex; justify-content:center; align-items:center; gap:16px; margin-top:10px}
.btn.yes{background:var(--primary); color:#fff; font-size:20px; padding:14px 34px; box-shadow:0 6px 18px rgba(224,67,107,.35); transition:transform .3s}
.btn.no{background:#e5e7eb; color:#374151; font-size:16px; transition:left .25s, top .25s}

.contract{background:#fffdf5; border:1px dashed var(--primary); border-radius:12px; padding:16px 18px; font-size:14px; margin:10px 0 14px}
.contract ol{padding-left:20px; display:grid; gap:6px; margin-top:8px}
.firmas-pad{display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-top:6px}
.firma-pad-box{text-align:center}
.firma-pad-box canvas{width:100%; height:160px; background:#fff; border:2px dashed var(--border); border-radius:12px; touch-action:none; cursor:crosshair; display:block}
.firma-pad-box .nombre{font-size:13px; font-weight:600; margin-top:6px}
.firma-pad-box .btn{padding:6px 14px; font-size:13px; margin-top:6px}
.firmas{display:grid; grid-template-columns:1fr 1fr; gap:18px; margin:14px 0; align-items:end}
.firma-box{text-align:center}
.firma-box img{width:100%; max-width:260px; height:110px; object-fit:contain; display:block; margin:0 auto; border-bottom:2px solid var(--primary)}
.firma-box .nombre{font-size:13px; color:var(--muted); margin-top:6px}
@media (max-width:560px){ .firmas-pad, .firmas{grid-template-columns:1fr} }
#firma{width:100%; height:180px; background:#fff; border:2px dashed var(--border); border-radius:12px; touch-action:none; cursor:crosshair; display:block}

.signed-img{max-width:280px; width:100%; display:block; margin:6px auto; border-bottom:2px solid var(--primary)}
.center{text-align:center}

#toast{
  position:fixed; left:50%; bottom:28px; transform:translate(-50%,30px); opacity:0; z-index:20;
  background:#1f2430; color:#fff; padding:12px 18px; border-radius:12px; font-size:14px;
  transition:all .35s ease; max-width:90vw; text-align:center; pointer-events:none;
}
#toast.show{opacity:1; transform:translate(-50%,0)}

.confetti{position:fixed; left:50%; bottom:20%; z-index:30; pointer-events:none; font-size:26px; animation:burst 2.2s ease-out forwards}
@keyframes burst{
  0%{transform:translate(0,0) scale(.4) rotate(0); opacity:1}
  100%{transform:translate(var(--x),var(--y)) scale(1.2) rotate(var(--r)); opacity:0}
}

footer{position:relative; z-index:2; text-align:center; font-size:12px; color:var(--muted); padding:16px}

@media (max-width:560px){
  .card{padding:20px}
  h1{font-size:23px}
  body[data-theme="3"] h1, body[data-theme="4"] h1{font-size:32px}
  .kpis{grid-template-columns:1fr}
  .topbar{padding:12px 14px}
  .user-chip{display:none}
}
</style>
</head>
<body data-theme="0">
  <div id="bg-romance"></div>
  <div id="petals"></div>

  <header class="topbar">
    <div class="brand">
      <div class="logo" id="logo">F</div>
      <div class="brand-text">
        <span id="brandText">FECOVITA</span>
        <small id="brandSub">Portal de Vendedores · Encuestas</small>
      </div>
    </div>
    <div class="user-chip" id="userChip">👤 Usuario</div>
  </header>

  <main>
    <section class="card" id="card">
      <div class="progress">
        <div class="progress-label"><span id="progressLabel">Progreso de la encuesta</span><span id="progressPct">0%</span></div>
        <div class="bar"><div id="bar"></div></div>
      </div>
      <div id="screen"></div>
    </section>
  </main>

  <footer id="footer">© 2026 FECOVITA Coop. Ltda. · Sistema de Encuestas v1.0</footer>
  <div id="toast"></div>

<script>
/* ============================================================
   CONFIGURACIÓN — personalizá todo acá
   ============================================================ */
const CONFIG = {
  ella: "Mayra",
  ellaCompleto: "Mayra Avila Alvarez",
  mi: "Martín",                       // tu nombre como querés que aparezca
  yo: "Martín Alejandro Lucero",                       // tu nombre como querés que aparezca
  ciudad: "Mendoza",
  floresJuego: 12,                    // flores a atrapar en el minijuego
  cualidades: [                       // ✏️ CAMBIALAS por cosas reales de ella
    "Tu sonrisa, que me arregla cualquier día 😊",
    "Tus abrazos, son la contencion perfecta 🤗",
    "Cómo te reís de mis chistes malos (incluso los de programación)",
    "Lo buena persona que sos",
    "Que con vos el tiempo pasa diferente",
    "Le das colores a mi vida",
    "Sos hermosa y me tenes locamente enamorado",
    "Que con vos todo es más lindo 🌻"
  ],
  ventajas: [
    "🛠️ Soporte técnico 24/7: compu, celu, wifi y la impresora.",
    "🐛 Soy experto en encontrar errores... y en vos no encontré ninguno.",
    "🧯 Uso try/catch: si algo sale mal, lo atrapo y lo resuelvo.",
    "🚀 Deploy continuo: este amor recibe mejoras todos los días.",
    "💾 Hago backup de todos nuestros recuerdos (con redundancia).",
    "💻 Cada aniversario te puede tocar una página como esta.",
    "❤️ Tengo mucho amor para dar y solo ojos para vos.",
    "🥷 Me hackeaste. Te amo con todo mi corazon, mi ser, me volves loco a mas no poder.",
    "🔐 Tu corazón queda protegido con JWT: solo yo tengo acceso 😌 prometo cuidarlo."
  ],
  mensajeFinal: "Gracias por hacer esta encuesta (y por decir que sí). Prometo que esta es la mejor página que programé en mi vida. 💛"
};

/* ============================================================
   UTILIDADES
   ============================================================ */
const $ = s => document.querySelector(s);
const screenEl = $('#screen'), card = $('#card');
const respuestas = {};
let idx = 0, cleanup = null, petalTimer = null;

function toast(msg, ms = 2200){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), ms);
}

function confetti(n = 70){
  const items = ['💛','❤️','🌻','🌼','💕','✨','🌷'];
  for (let i = 0; i < n; i++){
    const s = document.createElement('span');
    s.className = 'confetti';
    s.textContent = items[i % items.length];
    s.style.setProperty('--x', (Math.random()*2-1)*50 + 'vw');
    s.style.setProperty('--y', -(Math.random()*70+10) + 'vh');
    s.style.setProperty('--r', (Math.random()*720-360) + 'deg');
    s.style.animationDelay = (Math.random()*.4) + 's';
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 2800);
  }
}

function setPetals(theme){
  clearInterval(petalTimer);
  const rates = [0, 3500, 1400, 650, 320];
  const sets  = [[], ['🌼'], ['🌼','🌻','💛'], ['🌼','🌻','💛','❤️'], ['🌼','🌻','💛','❤️','🌷','💕']];
  if (!rates[theme]) return;
  petalTimer = setInterval(() => {
    const p = document.createElement('span');
    p.className = 'petal';
    const set = sets[theme];
    p.textContent = set[Math.random()*set.length | 0];
    p.style.left = Math.random()*100 + 'vw';
    p.style.fontSize = (14 + Math.random()*18) + 'px';
    const d = 7 + Math.random()*6;
    p.style.animationDuration = d + 's';
    $('#petals').appendChild(p);
    setTimeout(() => p.remove(), d*1000);
  }, rates[theme]);
}

function setTheme(t){
  if (document.body.dataset.theme === String(t)) return;
  document.body.dataset.theme = t;
  const brand = $('#brandText'), sub = $('#brandSub'), logo = $('#logo'), foot = $('#footer');
  const labels = [
    ['FECOVITA','Portal de Vendedores · Encuestas','F','© 2026 FECOVITA Coop. Ltda. · Sistema de Encuestas v1.0'],
    ['FECOVITA','Portal de Vendedores · Encuestas','F','© 2026 FECOVITA Coop. Ltda. · Sistema de Encuestas v1.0'],
    ['FECOVITA','Portal de Vend... ¿Sentimientos? 💛','F','© 2026 FECOVITA Coop. Ltda. · Sistema de Encuestas v1.0 (modificado)'],
    ['FECO💛ITA','Portal de Sentimientos','🌻','Hecho con 💛 (y un poco de JavaScript)'],
    [`${CONFIG.mi} 💛 ${CONFIG.ella}`,'Portal de Nosotros','🌻',`Hecho con todo mi 💛 por ${CONFIG.yo}`]
  ][t];
  [brand.textContent, sub.textContent, logo.textContent, foot.textContent] = labels;
  setPetals(t);
}

function updateProgress(){
  const pct = Math.round(idx / (screens.length - 1) * 100);
  $('#bar').style.width = pct + '%';
  $('#progressPct').textContent = pct + '%';
  const t = screens[idx].theme;
  $('#progressLabel').textContent =
    t <= 1 ? 'Progreso de la encuesta' :
    t === 2 ? 'Progreso de la encuesta (?)' : 'Progreso de mi corazón 💓';
}

function go(i){
  if (cleanup){ cleanup(); cleanup = null; }
  idx = i;
  card.classList.add('out');
  setTimeout(() => {
    setTheme(screens[i].theme);
    screenEl.innerHTML = '';
    screens[i].render(screenEl);
    updateProgress();
    card.classList.remove('out');
    window.scrollTo({top:0, behavior:'smooth'});
  }, 350);
}
const next = (delay = 0) => setTimeout(() => go(idx + 1), delay);

function opciones(el, lista, onPick){
  const wrap = document.createElement('div');
  wrap.className = 'options';
  lista.forEach(txt => {
    const b = document.createElement('button');
    b.className = 'option'; b.innerHTML = txt;
    b.onclick = () => {
      wrap.querySelectorAll('.option').forEach(x => x.disabled = true);
      b.classList.add('selected');
      onPick(b.textContent.trim(), b);
    };
    wrap.appendChild(b);
  });
  el.appendChild(wrap);
}

function loadingScreen(theme, mensajes, total = 3600){
  return {
    theme,
    render(el){
      el.innerHTML = `<div class="loader"><div class="spinner"></div><p id="lmsg" class="muted">${mensajes[0]}</p></div>`;
      let k = 0;
      const step = total / mensajes.length;
      const h = setInterval(() => { k++; if (k < mensajes.length) $('#lmsg').textContent = mensajes[k]; }, step);
      const n = setTimeout(() => go(idx + 1), total);
      cleanup = () => { clearInterval(h); clearTimeout(n); };
    }
  };
}

const fechaHoy = () => new Date().toLocaleDateString('es-AR', {day:'numeric', month:'long', year:'numeric'});

/* Pad de firma reutilizable (se usa para las dos firmas) */
function crearPadFirma(canvas, onChange){
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const r = canvas.getBoundingClientRect();
  canvas.width = r.width * dpr; canvas.height = r.height * dpr; ctx.scale(dpr, dpr);
  ctx.lineWidth = 2.6; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#7a1f3d';
  let drawing = false, last = null, trazos = 0;
  const pos = e => { const b = canvas.getBoundingClientRect(); return {x:e.clientX-b.left, y:e.clientY-b.top}; };
  canvas.addEventListener('pointerdown', e => { drawing = true; last = pos(e); canvas.setPointerCapture(e.pointerId); });
  canvas.addEventListener('pointermove', e => {
    if (!drawing) return;
    const p = pos(e);
    ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(p.x, p.y); ctx.stroke();
    last = p; trazos++;
    onChange(trazos > 25);
  });
  ['pointerup','pointercancel'].forEach(t => canvas.addEventListener(t, () => drawing = false));
  return {
    limpiar(){ ctx.clearRect(0, 0, canvas.width, canvas.height); trazos = 0; onChange(false); },
    dataURL: () => canvas.toDataURL('image/png')
  };
}

const cargarImg = src => new Promise(res => {
  if (!src) return res(null);
  const i = new Image(); i.onload = () => res(i); i.onerror = () => res(null); i.src = src;
});

/* ============================================================
   PANTALLAS
   ============================================================ */
const screens = [

  /* 0 — Intro corporativa */
  { theme:0, render(el){
    $('#userChip').textContent = `👤 ${CONFIG.ella} A.`;
    el.innerHTML = `
      <div class="tag">Encuesta institucional · ID FCV-2026-${Math.floor(1000+Math.random()*8999)}</div>

/* ============================================================
   COMPROBANTE PNG
   ============================================================ */
function wrapText(ctx, text, x, y, maxW, lh){
  const words = text.split(' '); let line = '';
  for (const w of words){
    const test = line + w + ' ';
    if (ctx.measureText(test).width > maxW && line){ ctx.fillText(line.trim(), x, y); line = w + ' '; y += lh; }
    else line = test;
  }
  ctx.fillText(line.trim(), x, y);
  return y + lh;
}

async function descargarComprobante(){
  const c = document.createElement('canvas'); c.width = 900; c.height = 1150;
  const x = c.getContext('2d');
  x.fillStyle = '#fff6d8'; x.fillRect(0, 0, c.width, c.height);
  x.strokeStyle = '#e0436b'; x.lineWidth = 6; x.strokeRect(30, 30, 840, 1090);
  x.textAlign = 'center';
  x.fillStyle = '#e0436b'; x.font = 'bold 64px "Dancing Script", cursive';
  x.fillText('Contrato de Noviazgo', 450, 140);
  x.font = '70px serif'; x.fillText('💛🌻💛', 450, 240);
  x.fillStyle = '#333'; x.font = '26px Inter, "Segoe UI", sans-serif';
  let y = 320;
  y = wrapText(x, `En ${CONFIG.ciudad}, el ${respuestas.fecha || fechaHoy()}, ${CONFIG.ellaCompleto} aceptó ser la novia de ${CONFIG.yo}.`, 450, y, 740, 38);
  y += 20;
  ['Abrazos y besos ilimitados, sin necesidad de aprobación.',
   `Prometo amarte y cuidarte con todo mi corazón.`,
   `Compartir y acompañar en las buenas y las malas.`,
   `Primera salida: ${respuestas.plan || 'mates en Chacras de Coria'}.`,
   'Toda discusión se resuelve con try { hablar } catch { abrazo }.',
   'Renovación automática diaria. Sin vencimiento.'
  ].forEach(t => { y = wrapText(x, '• ' + t, 450, y, 740, 36); });
  const [imgElla, imgYo] = await Promise.all([cargarImg(respuestas.firma), cargarImg(respuestas.firmaYo)]);
  const dibujarFirma = (img, cx, nombre) => {
    const boxW = 340, boxH = 120, top = 790, lineY = 920;
    if (img){
      const sc = Math.min(boxW / img.width, boxH / img.height);
      const w = img.width * sc, h = img.height * sc;
      x.drawImage(img, cx - w/2, top + (boxH - h), w, h);
    }
    x.strokeStyle = '#333'; x.lineWidth = 2;
    x.beginPath(); x.moveTo(cx - 170, lineY); x.lineTo(cx + 170, lineY); x.stroke();
    x.fillStyle = '#333'; x.font = '20px Inter, sans-serif';
    x.fillText(nombre, cx, lineY + 32);
  };
  dibujarFirma(imgElla, 240, CONFIG.ellaCompleto);
  dibujarFirma(imgYo,   660, CONFIG.yo);
  x.fillStyle = '#e0436b'; x.font = 'bold 40px "Dancing Script", cursive';
  x.fillText(`— Te amo —`, 450, 1070);
  const a = document.createElement('a');
  a.download = `contrato-novia-${CONFIG.ella.toLowerCase()}.png`;
  a.href = c.toDataURL('image/png'); a.click();
}
